name: 'Release Pull Request'

on:
  push:
    branches:
      - releases/*

jobs:
  build:
    #name: ${{ matrix.friendlyName }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
      - name: Setup Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 16.13.0

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"

      - uses: actions/cache@v2
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
            ${{ runner.os }}-yarn-

      - name: Install and build dependencies
        run: yarn

      - name: Create Pull Request content
        id: create_pr_content
        run: |
          echo "##[set-output name=pr_title;]$(yarn draft-release:pr title)"
          echo "##[set-output name=pr_body;]$(yarn draft-release:pr body)"

      - name: Create Release Pull Request
        uses: peter-evans/create-pull-request@v4.0.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: ${{ steps.create_pr_content.outputs.pr_title }}
          body: ${{ steps.create_pr_content.outputs.pr_body }}
          branch: ${{ github.ref }}
          base: development
